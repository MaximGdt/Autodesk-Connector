name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (warnings are errors)
        run: dotnet build AutocadMcp.sln -c Release
      - name: Unit, speed and security tests
        run: dotnet test AutocadMcp.sln -c Release --no-build --logger "console;verbosity=normal"
